<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本GEJP淨水設備 - 商品與據點</title>
    <!-- 引入 Tailwind CSS 快速排版 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .category-btn.active { @apply bg-blue-600 text-white; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- 導航欄 -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-800 flex items-center gap-2">
                💧 日本GEJP淨水設備
            </h1>
            <div class="space-x-4">
                <a href="#products-section" class="hover:text-blue-600 font-medium">全站商品</a>
                <a href="#stores-section" class="hover:text-blue-600 font-medium">聯絡據點</a>
            </div>
        </div>
    </nav>

    <!-- 主視覺 Banner -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-900 text-white py-16 text-center">
        <h2 class="text-3xl md:text-4xl font-extrabold mb-4">給家人最純淨的高品質好水</h2>
        <p class="text-blue-100 text-lg">專業銀離子抑菌生飲淨水系統</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10">
        
        <!-- 商品區塊 -->
        <section id="products-section" class="mb-16">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <h3 class="text-2xl font-bold text-gray-900 border-l-4 border-blue-600 pl-3">全站商品</h3>
                <!-- 分類篩選按鈕列 -->
                <div id="category-container" class="flex flex-wrap gap-2">
                    <button onclick="filterCategory('all')" class="category-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 hover:bg-gray-300 transition">全部</button>
                </div>
            </div>
            
            <!-- 商品卡片渲染區 -->
            <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-gray-500 col-span-full text-center py-10">商品資料加載中...</p>
            </div>
        </section>

        <!-- 據點區塊 -->
        <section id="stores-section" class="bg-white rounded-xl shadow-sm p-6 md:p-8">
            <h3 class="text-2xl font-bold text-gray-900 border-l-4 border-blue-600 pl-3 mb-8">服務據點</h3>
            <!-- 據點卡片渲染區 -->
            <div id="stores-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <p class="text-gray-500 col-span-full text-center py-4">據點資料加載中...</p>
            </div>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm mt-20">
        <p>© 2026 日本GEJP淨水設備. All rights reserved.</p>
    </footer>

    <!-- 前端渲染邏輯 JavaScript -->
    <script>
        // ⚠️ 請在此處替換成您自己的 Google Apps Script 網頁應用程式網址
        const API_URL = 'https://script.google.com/macros/s/AKfycbysOWRqeWrZL1VaajDX1gd8MiO_Joiqrq93j1HHgjFRb7-viGsfN7bV1hgZymWUIEoa/exec';
        
        let allProducts = [];

        // 網頁開啟後自動抓取後端資料
        async function init() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                allProducts = data.products;
                renderCategories(allProducts);
                renderProducts(allProducts);
                renderStores(data.stores);
            } catch (error) {
                console.error("資料讀取失敗:", error);
                document.getElementById('products-grid').innerHTML = '<p class="text-red-500 text-center col-span-full">無法讀取資料，請檢查後端設定。</p>';
            }
        }

        // 動態生成分類按鈕
        function renderCategories(products) {
            const container = document.getElementById('category-container');
            const categories = ['all', ...new Set(products.map(p => p.Category).filter(Boolean))];
            
            container.innerHTML = categories.map(cat => {
                const isAll = cat === 'all';
                return `<button onclick="filterCategory('${cat}', this)" class="category-btn ${isAll ? 'active bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'} px-4 py-1.5 rounded-full text-sm font-medium hover:bg-blue-500 hover:text-white transition">${isAll ? '全部' : cat}</button>`;
            }).join('');
        }

        // 篩選分類邏輯
        function filterCategory(category, btnElement) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active', 'bg-blue-600', 'text-white'));
            if(btnElement) {
                btnElement.classList.add('active', 'bg-blue-600', 'text-white');
            }
            
            const filtered = category === 'all' ? allProducts : allProducts.filter(p => p.Category === category);
            renderProducts(filtered);
        }

        // 渲染商品卡片
        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            if(products.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 text-center col-span-full">暫無商品</p>';
                return;
            }
            
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition flex flex-col">
                    <div class="h-56 bg-gray-100 flex items-center justify-center overflow-hidden">
                        <img src="${p.ImageUrl || 'https://placehold.co'}" alt="${p.Name}" class="object-cover w-full h-full hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co'">
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="inline-block px-2.5 py-0.5 bg-blue-50 text-blue-700 text-xs font-semibold rounded mb-2">${p.Category || '一般'}</span>
                            <h4 class="font-bold text-gray-900 text-base line-clamp-2 mb-2">${p.Name}</h4>
                        </div>
                        <div class="mt-4 flex items-baseline gap-2">
                            <span class="text-xl font-extrabold text-red-600">$${Number(p.Price).toLocaleString()}</span>
                            ${p.OriginalPrice ? `<span class="text-sm text-gray-400 line-through">$${Number(p.OriginalPrice).toLocaleString()}</span>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染據點卡片（點擊地址直接調轉至 Google 地圖）
        function renderStores(stores) {
            const grid = document.getElementById('stores-grid');
            if(!stores || stores.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 text-center col-span-full">暫無據點資訊</p>';
                return;
            }
            
            grid.innerHTML = stores.map(s => `
                <div class="border border-gray-100 bg-gray-50 rounded-xl p-5 hover:border-blue-200 transition">
                    <h4 class="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
                        📍 ${s.StoreName}
                    </h4>
                    <div class="space-y-2 text-sm text-gray-600 mb-4">
                        <p><strong>電話：</strong><a href="tel:${s.Phone}" class="text-blue-600 hover:underline">${s.Phone}</a></p>
                        <p><strong>地址：</strong>${s.Address}</p>
                    </div>
                    <a href="https://google.com{encodeURIComponent(s.Address)}" 
                       target="_blank" 
                       class="inline-flex items-center justify-center w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm shadow-sm transition gap-2">
                       🗺️ 開啟 Google 地圖查看
                    </a>
                </div>
            `).join('');
        }

        // 啟動網頁
        init();
    </script>
</body>
</html>
